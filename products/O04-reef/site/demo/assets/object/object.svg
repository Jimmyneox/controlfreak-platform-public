<g id="corals"><path d="M90 246c0-30 10-40 10-60m0 30 15-15m-15 30-12-10" stroke="#ff6f61" stroke-width="7" fill="none" stroke-linecap="round"/><ellipse cx="290" cy="238" rx="30" ry="12" fill="#ff9f80"/><path d="M200 246v-40m0 15 14-14" stroke="#f2c14e" stroke-width="6" fill="none" stroke-linecap="round"/></g>
