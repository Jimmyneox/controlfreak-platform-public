<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" id="c01-cold-plunge" class="cf-demo-object" data-state="">
<style>
.cf-demo-object .state{opacity:0;transition:opacity .4s}
.cf-demo-object #water{transition:transform .6s;transform-origin:50% 100%;transform-box:fill-box}
.chiller-on #chiller-active,.power-on #power-led{opacity:1}
#water-cool{transition:opacity .6s}.temp-neutral #water-cool{opacity:0}
</style>
<g id="deck"><rect x="0" y="250" width="400" height="50" fill="#1e293b"/></g>
<g id="tub"><path d="M40 110h260l-16 140H56z" fill="#e5edf3" stroke="#2f6f9f" stroke-width="5"/></g>
<g id="water"><path d="M52 140h236l-12 104H64z" fill="#7fa6b8"/></g>
<g id="water-cool"><path d="M52 140h236l-12 104H64z" fill="#2f6f9f"/></g>
<g id="ripples"><path d="M70 150c14-6 24 6 38 0s24 6 38 0 24 6 38 0 24 6 38 0" stroke="#e5edf3" stroke-width="3" fill="none" opacity=".7"/></g>
<g id="chiller"><rect x="315" y="170" width="70" height="80" rx="6" fill="#0b1f3a" stroke="#2f6f9f" stroke-width="3"/><path d="M300 230h15" stroke="#94a3b8" stroke-width="6"/></g>
<g id="chiller-active" class="state"><path d="M350 186v40m-14-30 28 20m0-20-28 20" stroke="#9fd3ff" stroke-width="4" stroke-linecap="round"/></g>
<g id="power-led" class="state"><circle cx="372" cy="240" r="5" fill="#5eead4"/></g>
</svg>
